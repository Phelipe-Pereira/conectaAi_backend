# Configuração SonarQube
sonar.projectKey=conectaai-gateway
sonar.projectName=ConectaAI Gateway
sonar.projectVersion=1.0

# Configuração do servidor
# Para uso local: http://localhost:9000
# Para uso dentro do Docker: http://conectaai-sonarqube:9000
sonar.host.url=http://localhost:9000
# Token configurado (pode ser sobrescrito via variável de ambiente SONAR_TOKEN ou propriedade -Dsonar.token)
sonar.token=sqa_a5640cee20eba04c79e5030ca5a02b6364c20b61

# Configuração de código fonte
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=build/classes

# Configuração de relatórios
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
sonar.java.checkstyle.reportPaths=build/reports/checkstyle/main.xml

# Configurações Java
sonar.java.source=21
sonar.java.target=21

# Exclusões
sonar.exclusions=**/*.gradle,**/build/**
