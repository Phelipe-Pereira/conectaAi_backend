plugins {
    id 'checkstyle'
    id 'jacoco'
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.sonarqube' version '4.4.1.3373'
    id 'com.github.spotbugs' version '5.2.5'
}

checkstyle {
    toolVersion = '10.12.4'
    configFile = file('config/checkstyle/checkstyle.xml')
    ignoreFailures = false
    maxWarnings = 200
}

jacoco {
    toolVersion = '0.8.11'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        csv.required = false
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.70 // 70% cobertura mínima
            }
        }
    }
}

spotbugs {
    toolVersion = '4.8.6'
    effort = 'max'
    reportLevel = 'low'
    excludeFilter = file('config/spotbugs/exclude.xml')
    ignoreFailures = true
}

spotbugsMain {
    reports {
        html {
            required = true
            outputLocation = file("$buildDir/reports/spotbugs/main.html")
        }
        xml {
            required = true
            outputLocation = file("$buildDir/reports/spotbugs/main.xml")
        }
    }
}

spotbugsTest {
    reports {
        html {
            required = true
            outputLocation = file("$buildDir/reports/spotbugs/test.html")
        }
        xml {
            required = true
            outputLocation = file("$buildDir/reports/spotbugs/test.xml")
        }
    }
}


sonar {
    properties {
        property 'sonar.projectKey', 'conectaai-gateway'
        property 'sonar.projectName', 'ConectaAI Gateway'
        property 'sonar.host.url', System.getProperty('sonar.host.url', 'http://localhost:9000')
        property 'sonar.token', System.getProperty('sonar.token', System.getenv('SONAR_TOKEN') ?: 'sqa_a5640cee20eba04c79e5030ca5a02b6364c20b61')
        property 'sonar.sources', 'src/main/java'
        property 'sonar.tests', 'src/test/java'
        property 'sonar.java.coveragePlugin', 'jacoco'
        property 'sonar.coverage.jacoco.xmlReportPaths', 'build/reports/jacoco/test/jacocoTestReport.xml'
        property 'sonar.java.checkstyle.reportPaths', 'build/reports/checkstyle/main.xml'
        property 'sonar.spotbugs.reportPaths', 'build/reports/spotbugs/main.xml'
    }
}

test.finalizedBy jacocoTestReport

tasks.named('check') {
    dependsOn 'spotbugsMain', 'spotbugsTest'
}

group = 'com.conectaai'
version = '0.0.1-SNAPSHOT'
description = 'Middleware unificado para múltiplos gateways de pagamento'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    implementation('org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0') {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
    }
    implementation 'org.apache.commons:commons-lang3:3.18.0'

    // SDKs dos gateways
    implementation('com.asaas:api-sdk:1.0.3') {
        exclude group: 'org.sonatype.sisu', module: 'sisu-guice'
        exclude group: 'com.google.inject', module: 'guice'
    }
    implementation 'com.google.inject:guice:7.0.0'
    
    implementation('com.mercadopago:sdk-java:2.0.0') {
        exclude group: 'org.sonatype.sisu', module: 'sisu-guice'
    }
    implementation('com.stripe:stripe-java:24.0.0') {
        exclude group: 'org.sonatype.sisu', module: 'sisu-guice'
    }

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Liquibase
    implementation 'org.liquibase:liquibase-core'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    // Lombok / Postgres
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'

    // SpotBugs e FindSecBugs
    spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.13.0'

    // Testes
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.amqp:spring-rabbit-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Bibliotecas para normalização e validação
    implementation 'com.google.guava:guava:32.1.3-jre'
    implementation 'com.googlecode.libphonenumber:libphonenumber:8.13.19'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.annotationProcessorPath = configurations.annotationProcessor
    options.compilerArgs += ['-parameters']
}
