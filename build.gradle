plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.conectaai'
version = '0.0.1-SNAPSHOT'
description = 'Middleware unificado para múltiplos gateways de pagamento'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(20)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    implementation('org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0') {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
    }
    implementation 'org.apache.commons:commons-lang3:3.18.0'

    // SDKs dos gateways
    implementation('com.asaas:api-sdk:1.0.3') {
        exclude group: 'org.sonatype.sisu', module: 'sisu-guice'
        exclude group: 'com.google.inject', module: 'guice'
    }
    implementation 'com.google.inject:guice:7.0.0'
    
    implementation('com.mercadopago:sdk-java:2.0.0') {
        exclude group: 'org.sonatype.sisu', module: 'sisu-guice'
    }
    implementation('com.stripe:stripe-java:24.0.0') {
        exclude group: 'org.sonatype.sisu', module: 'sisu-guice'
    }

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Liquibase
    implementation 'org.liquibase:liquibase-core'

    // Lombok / Postgres
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'

    // Testes
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.amqp:spring-rabbit-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
