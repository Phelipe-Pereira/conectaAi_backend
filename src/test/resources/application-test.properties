# Configuração para testes
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Console (para debug se necessário)
spring.h2.console.enabled=true

# JPA/Hibernate para testes
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Liquibase desabilitado para testes
spring.liquibase.enabled=false

# RabbitMQ mock para testes
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Tokens fake para testes
asaas.token=fake_asaas_token
stripe.secret=fake_stripe_secret
mp.access.token=fake_mp_token
