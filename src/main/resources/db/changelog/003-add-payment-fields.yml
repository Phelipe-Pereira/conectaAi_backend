databaseChangeLog:
  - changeSet:
      id: 003-add-payment-fields
      author: system
      changes:
        - addColumn:
            tableName: payment
            columns:
              - column:
                  name: description
                  type: VARCHAR(500)
                  constraints:
                    nullable: true
              - column:
                  name: payment_method
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

