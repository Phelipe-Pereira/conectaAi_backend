databaseChangeLog:
  - changeSet:
      id: 006-create-password-reset-token-table
      author: conectaai
      changes:
        - createTable:
            tableName: password_reset_token
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: token
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: used_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: password_reset_token
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_password_reset_token_user
            onDelete: CASCADE
            onUpdate: CASCADE

        - createIndex:
            tableName: password_reset_token
            indexName: idx_password_reset_token
            columns:
              - column:
                  name: token

        - createIndex:
            tableName: password_reset_token
            indexName: idx_password_reset_user
            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: password_reset_token
            indexName: idx_password_reset_expires
            columns:
              - column:
                  name: expires_at