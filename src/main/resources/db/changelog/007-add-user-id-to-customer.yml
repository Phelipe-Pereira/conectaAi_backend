databaseChangeLog:
  - changeSet:
      id: 007-add-user-id-to-customer
      author: conectaai
      changes:
        - addColumn:
            tableName: customer
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            baseTableName: customer
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_customer_user
            onDelete: SET NULL

        - createIndex:
            tableName: customer
            indexName: idx_customer_user_id
            columns:
              - column:
                  name: user_id
