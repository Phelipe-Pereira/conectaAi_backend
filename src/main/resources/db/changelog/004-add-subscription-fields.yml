databaseChangeLog:
  - changeSet:
      id: 004-add-subscription-fields
      author: system
      changes:
        - addColumn:
            tableName: subscription
            columns:
              - column:
                  name: description
                  type: VARCHAR(500)
                  constraints:
                    nullable: true
              - column:
                  name: billing_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

