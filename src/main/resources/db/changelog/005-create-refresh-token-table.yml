databaseChangeLog:
  - changeSet:
      id: 005-create-refresh-token-table
      author: conectaai
      changes:
        - createTable:
            tableName: refresh_token
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: token
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: revoked_at
                  type: TIMESTAMP
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: refresh_token
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_refresh_token_user
            onDelete: CASCADE
            onUpdate: CASCADE

        - createIndex:
            tableName: refresh_token
            indexName: idx_refresh_token
            columns:
              - column:
                  name: token

        - createIndex:
            tableName: refresh_token
            indexName: idx_refresh_user
            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: refresh_token
            indexName: idx_refresh_expires
            columns:
              - column:
                  name: expires_at

