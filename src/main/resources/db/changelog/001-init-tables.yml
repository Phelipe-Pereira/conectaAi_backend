databaseChangeLog:
  - changeSet:
      id: 001-customers-payments-subscriptions-refunds-webhooks-idempotency
      author: lipe
      changes:
        - createTable:
            tableName: customer
            columns:
              - column: { name: id, type: BIGSERIAL, constraints: { primaryKey: true } }
              - column: { name: external_id, type: VARCHAR(100), constraints: { nullable: false, unique: true } }
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: email, type: VARCHAR(255) }
              - column: { name: document, type: VARCHAR(32) }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: NOW() }

        - createTable:
            tableName: payment
            columns:
              - column: { name: id, type: BIGSERIAL, constraints: { primaryKey: true } }
              - column: { name: public_id, type: VARCHAR(64), constraints: { nullable: false, unique: true } }
              - column: { name: customer_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: amount, type: NUMERIC(19,2), constraints: { nullable: false } }
              - column: { name: currency, type: VARCHAR(8), constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: due_date, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: provider, type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: provider_reference, type: VARCHAR(128) }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: NOW() }

        - addForeignKeyConstraint:
            baseTableName: payment
            baseColumnNames: customer_id
            referencedTableName: customer
            referencedColumnNames: id
            constraintName: fk_payment_customer

        - createTable:
            tableName: subscription
            columns:
              - column: { name: id, type: BIGSERIAL, constraints: { primaryKey: true } }
              - column: { name: public_id, type: VARCHAR(64), constraints: { nullable: false, unique: true } }
              - column: { name: customer_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: amount, type: NUMERIC(19,2), constraints: { nullable: false } }
              - column: { name: currency, type: VARCHAR(8), constraints: { nullable: false } }
              - column: { name: interval, type: VARCHAR(16), constraints: { nullable: false } }
              - column: { name: start_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: end_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: status, type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: provider, type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: provider_reference, type: VARCHAR(128) }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: NOW() }

        - addForeignKeyConstraint:
            baseTableName: subscription
            baseColumnNames: customer_id
            referencedTableName: customer
            referencedColumnNames: id
            constraintName: fk_subscription_customer

        - createTable:
            tableName: refund
            columns:
              - column: { name: id, type: BIGSERIAL, constraints: { primaryKey: true } }
              - column: { name: payment_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: amount, type: NUMERIC(19,2), constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: provider_reference, type: VARCHAR(128) }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: NOW() }

        - addForeignKeyConstraint:
            baseTableName: refund
            baseColumnNames: payment_id
            referencedTableName: payment
            referencedColumnNames: id
            constraintName: fk_refund_payment

        - createTable:
            tableName: webhook_event
            columns:
              - column: { name: id, type: BIGSERIAL, constraints: { primaryKey: true } }
              - column: { name: provider, type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: event_type, type: VARCHAR(64), constraints: { nullable: false } }
              - column: { name: payload, type: JSONB, constraints: { nullable: false } }
              - column: { name: processed, type: BOOLEAN, defaultValueBoolean: false }
              - column: { name: received_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: NOW() }

        - createTable:
            tableName: idempotency
            columns:
              - column: { name: id, type: BIGSERIAL, constraints: { primaryKey: true } }
              - column: { name: idempotency_key, type: VARCHAR(128), constraints: { nullable: false, unique: true } }
              - column: { name: request_hash, type: VARCHAR(128), constraints: { nullable: false } }
              - column: { name: response_body, type: TEXT }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: NOW() }
