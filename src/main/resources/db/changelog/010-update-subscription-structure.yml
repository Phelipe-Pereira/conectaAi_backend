databaseChangeLog:
  - changeSet:
      id: 010-update-subscription-structure
      author: system
      changes:
        - renameColumn:
            tableName: subscription
            oldColumnName: public_id
            newColumnName: external_id
            columnDataType: VARCHAR(100)

        - renameColumn:
            tableName: subscription
            oldColumnName: provider_reference
            newColumnName: provider_subscription_id
            columnDataType: VARCHAR(100)

        - renameColumn:
            tableName: subscription
            oldColumnName: billing_type
            newColumnName: payment_method
            columnDataType: VARCHAR(50)

        - addColumn:
            tableName: subscription
            columns:
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: true

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: true

        - addUniqueConstraint:
            tableName: subscription
            columnNames: provider, provider_subscription_id
            constraintName: uk_subscription_provider_subscription_id

        - createIndex:
            tableName: subscription
            indexName: idx_subscription_external_id
            columns:
              - column:
                  name: external_id

        - createIndex:
            tableName: subscription
            indexName: idx_subscription_start_at
            columns:
              - column:
                  name: start_at

