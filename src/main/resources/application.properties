spring.application.name=conectaai-gateway
server.port=8080

# Liquibase (temporariamente desabilitado)
# spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yml
spring.liquibase.enabled=false

# Configuração para desenvolvimento local com Docker
spring.datasource.url=jdbc:postgresql://localhost:5433/conectaai
spring.datasource.username=conectaai
spring.datasource.password=conectaai
spring.jpa.hibernate.ddl-auto=create-drop

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Tokens dos gateways (desenvolvimento)
asaas.token=${ASAAS_TOKEN}
stripe.secret=${STRIPE_SECRET}
mp.access.token=${MP_ACCESS_TOKEN}
